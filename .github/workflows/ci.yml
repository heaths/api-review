name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run package:vsix
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Compute prerelease VSIX version
        id: prerelease
        if: github.event_name == 'pull_request'
        run: |
          version="$(pnpm run -s version:next)"
          version="${version#v}-pr.${{ github.event.pull_request.number }}+${{ github.run_id }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=$GITHUB_WORKSPACE/azure-api-review-$version.vsix" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Package prerelease VSIX
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec vsce package '${{ steps.prerelease.outputs.version }}' \
            --no-dependencies \
            --no-update-package-json \
            --no-git-tag-version \
            --pre-release \
            --out '${{ steps.prerelease.outputs.path }}'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: azure-api-review-${{ steps.prerelease.outputs.version }}.vsix
          path: ${{ steps.prerelease.outputs.path }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: xvfb-run -a pnpm test
        if: runner.os == 'Linux'
      - run: pnpm run test:headless
        if: runner.os != 'Linux'
