name: release

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  NODE_ENV: production

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - &setup-pnpm
        name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - &setup-node
        name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - &install-dependencies
        name: Install dependencies
        run: pnpm install --frozen-lockfile
      - &download-package
        name: Download package
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.test.outputs.artifact-id }}
      - &package-info
        name: Get package info
        id: info
        run: |
          echo 'tag=v${{ needs.test.outputs.version }}' >> "$GITHUB_OUTPUT"
          echo 'package=${{ steps.download.outputs.download-path }}/${{ needs.test.outputs.name }}' >> "$GITHUB_OUTPUT"
      - name: Generate CHANGELOG
        id: changelog
        run: |
          TAG='${{ steps.info.outputs.tag }}'
          # Use the current tag as the version. Creating the release will create the tag.
          pnpm exec git-cliff --unreleased --tag "$TAG" --strip header --output "$RUNNER_TEMP/CHANGELOG.md"
          echo "path=$RUNNER_TEMP/CHANGELOG.md" >> "$GITHUB_OUTPUT"
      - name: Attest package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.info.outputs.package }}
      - name: Create release
        run: >
          gh release create "$TAG"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --notes-file '${{ steps.changelog.outputs.path }}'
          '${{ steps.info.outputs.package }}'
        env:
          TAG: ${{ steps.info.outputs.tag }}

  publish:
    # Environment must match the Marketplace trusted publishing policy.
    environment: marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - test
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *setup-pnpm
      - *setup-node
      - *install-dependencies
      - *download-package
      - *package-info
      - name: Publish package
        run: pnpm exec vsce publish --oidc --packagePath '${{ steps.info.outputs.package }}'
