name: release

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

env:
  NODE_ENV: production

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    environment: marketplace
    runs-on: ubuntu-latest
    needs: test
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download package
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.test.outputs.artifact-id }}
      - name: Get package info
        id: info
        run: |
          echo 'tag=v${{ needs.test.outputs.version }}' >> "$GITHUB_OUTPUT"
          echo 'package=${{ steps.download.outputs.download-path }}/${{ needs.test.outputs.name }}' >> "$GITHUB_OUTPUT"
      - name: Draft release
        # Creates the tag used to generate the CHANGELOG for just the `--current`
        # version. A draft release does not create a real tag ref until it is
        # published, so the tag is created and pushed explicitly first.
        run: |
          TAG='${{ steps.info.outputs.tag }}'
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" --draft --title "$TAG" --notes ''
      - name: Generate CHANGELOG
        id: changelog
        run: |
          pnpm exec git-cliff --current --strip header --output /tmp/CHANGELOG.md
          echo 'path=/tmp/CHANGELOG.md' >> "$GITHUB_OUTPUT"
      - name: Attest package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.info.outputs.package }}
      - name: Update release info
        run: >
          gh release edit '${{ steps.info.outputs.tag }}'
          --notes-file '${{ steps.changelog.outputs.path }}'
      - name: Upload release package
        run: gh release upload '${{ steps.info.outputs.tag }}' '${{ steps.info.outputs.package }}'
      - name: Publish package
        run: >
          pnpm exec vsce publish
          --packagePath '${{ steps.info.outputs.package }}'
          --oidc
      - name: Ready release
        run: gh release edit '${{ steps.info.outputs.tag }}' --draft=false
