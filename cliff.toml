[changelog]
header = """
# Change Log

"""
body = """{% if version -%}
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
## Unreleased
{%- endif %}

{% for group, commits in commits | group_by(attribute="group") -%}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{% endfor %}

{% endfor -%}"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = true
protect_breaking_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_preprocessors = [
  { pattern = "(?m)^\\*\\s+((?:feat|fix|docs|style|refactor|perf|test|chore|ci)(?:\\([^)]+\\))?!?:)", replace = "${1}" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^docs|^style|^refactor|^perf|^test", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { body = ".*security", group = "<!-- 5 -->Security" },
  { message = "^chore|^ci", group = "<!-- 6 -->Other" },
]
filter_commits = true
topo_order_commits = true
sort_commits = "oldest"
