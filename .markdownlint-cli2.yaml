$schema: https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2/v0.23.2/schema/markdownlint-cli2-config-schema.json
globs:
  - "**/*.md"
gitignore: true

config:
  line-length:
    code_blocks: false

overrides:
- filter:
  - CHANGELOG.md
  combine: merge
  config:
    no-duplicate-heading: false
